<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ragnagrok Editor</title>
    <style>
      :root { --bg: #15171b; --panel: #1e2127; --border: #343943; --text: #dfe2e8; --dim: #949cab; --accent: #e0a34a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; overflow: hidden; }
      #app { display: grid; height: 100%; grid-template: 44px 1fr / 280px 1fr 300px; }
      #toolbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; }
      #toolbar .gap { width: 14px; flex: none; }
      #left, #right { background: var(--panel); overflow-y: auto; padding: 10px; }
      #left { border-right: 1px solid var(--border); }
      #right { border-left: 1px solid var(--border); }
      #center { position: relative; min-width: 0; min-height: 0; }
      #center canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #hint { position: absolute; left: 10px; bottom: 8px; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
      #status { margin-left: auto; color: var(--dim); max-width: 40vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      button, select, input, textarea { font: inherit; color: var(--text); background: #2a2e36; border: 1px solid var(--border); border-radius: 4px; padding: 4px 7px; }
      button { cursor: pointer; white-space: nowrap; }
      button:hover { border-color: var(--dim); }
      button.active { background: var(--accent); border-color: var(--accent); color: #181510; font-weight: 600; }
      button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      textarea { resize: vertical; }
      h3 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
      h3:first-child { margin-top: 0; }
      p { line-height: 1.4; }
      .row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; flex-wrap: wrap; }
      .field { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: center; margin-bottom: 5px; }
      .field label { color: var(--dim); }
      .field input, .field select, .field textarea { width: 100%; min-width: 0; }
      .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
      .three input { padding: 4px; }
      .list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
      .list button { text-align: left; background: transparent; border-color: transparent; }
      .list button.active { background: #3b3323; color: var(--accent); border-color: #6c5427; font-weight: 500; }
      .palette { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin-bottom: 6px; }
      .palette button { aspect-ratio: 1; padding: 0; border: 2px solid transparent; }
      .palette button.glow { box-shadow: 0 0 6px 1px #ffe2a0; }
      .palette button.active { border-color: #fff; }
      .dim { color: var(--dim); }
      input[type=color] { padding: 1px; height: 26px; }
      input[type=range] { padding: 0; }
      input[type=checkbox] { width: auto; }
      #error { position: fixed; inset: 0; display: none; place-content: center; background: var(--bg); white-space: pre-wrap; padding: 30px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <div id="left"></div>
      <div id="center"><canvas id="viewport" tabindex="0"></canvas><div id="hint"></div></div>
      <div id="right"></div>
    </div>
    <div id="error"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
