<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bloques · Ragnagrok Engine</title>
    <style>
      :root { color-scheme: light dark; --bg: #f3f0e8; --panel: #fffdf8; --text: #1b1f27; --muted: #545b68; --border: #d3d6dc; --run: #1f7a34; --run-text: #fff; }
      :root[data-theme="dark"] { --bg: #0d1016; --panel: #1a1e26; --text: #e9ecf1; --muted: #a9b1bf; --border: #2e3440; --run: #3fb760; --run-text: #07140b; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1016; --panel: #1a1e26; --text: #e9ecf1; --muted: #a9b1bf; --border: #2e3440; --run: #3fb760; --run-text: #07140b; } }
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); font: 16px/1.3 ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex: none; }
      header h1 { margin: 0 auto 0 0; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      select, button { font: inherit; font-weight: 700; min-height: 44px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg); color: var(--text); padding: 0 12px; }
      button { cursor: pointer; }
      button:focus-visible, select:focus-visible { outline: 3px solid #1660d0; outline-offset: 2px; }
      #run { background: var(--run); color: var(--run-text); border-color: transparent; padding: 0 18px; font-size: 17px; }
      #run[aria-pressed="true"] { background: #b91c1c; color: #fff; }
      main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
      #editor { min-height: 0; min-width: 0; }
      #preview { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-left: 1px solid var(--border); background: var(--panel); min-height: 0; overflow: auto; }
      canvas { width: 100%; height: 230px; flex: none; border-radius: 14px; }
      #msg { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--bg); font-weight: 700; min-height: 1.3em; }
      #msg[data-state="pass"] { background: #1f7a34; color: #fff; }
      #msg[data-state="fail"] { background: #b91c1c; color: #fff; }
      #goal { display: none; }
      @media (max-width: 760px) {
        header h1 { display: none; }
        select { flex: 1; min-width: 0; }
        main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
        #preview { order: -1; flex-direction: row; align-items: center; padding: 6px 10px; border-left: 0; border-bottom: 1px solid var(--border); overflow: visible; }
        canvas { width: 42%; height: 96px; }
        #msg { flex: 1; font-size: 14px; padding: 6px 10px; }
        #goal { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bloques</h1>
      <select id="level" aria-label="Desafío"></select>
      <button id="theme" type="button" aria-label="Cambiar tema">◐</button>
      <button id="run" type="button" aria-pressed="false">▶ Ejecutar</button>
    </header>
    <main>
      <div id="editor"></div>
      <section id="preview" aria-label="Tablero">
        <canvas id="view" width="720" height="432" aria-label="Tablero"></canvas>
        <p id="msg" role="status" aria-live="polite"></p>
        <p id="goal"></p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
